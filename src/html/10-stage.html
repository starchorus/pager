<!-- ==== 10 STAGE ==== -->
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="sky"></canvas>
  <canvas id="hud" aria-label="Wireless sky" role="img"></canvas>
</div>
<div id="crt"></div>
<div id="caption" hidden></div>
<div id="classbar-top"></div>
<div id="classbar-bot"></div>
<div id="dtg"></div>
<div id="bar" class="panel ph-only" role="group" aria-label="Status"><span id="bar-counts"><span class="bc"><b id="bar-ap">0</b><i>stars</i></span><span class="bc"><b id="bar-cl">0</b><i>satellites</i></span></span><div class="lamps" id="scope-lamps" role="img" hidden></div></div>
<div id="scope-strip" class="panel ph-only" role="group" aria-label="Scope readout"></div>
<div id="scope-foot" class="ph-only"><span class="l">lanes = band, channel
not direction</span><span id="sc-ps"></span><span class="r">arcs = signal (dBm)
not range</span><span id="sc-rx"></span><span id="sc-no" hidden>Too little room for the scope: turn the phone upright</span></div>
<button class="btn" id="panels-pill" aria-label="Show the panels"><span class="dot" id="pill-dot"></span><span id="pill-chip">Sample</span></button>
